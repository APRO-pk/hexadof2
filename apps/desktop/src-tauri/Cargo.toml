[package]
name = "hexadof-desktop"
description = "HexaDOF desktop application shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "hexadof-desktop"

[lib]
name = "hexadof_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex-core.workspace = true
hex-dynamics.workspace = true
hex-model.workspace = true
hex-telemetry.workspace = true
hex-flight-data.workspace = true
hex-analysis.workspace = true
hex-project.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nalgebra.workspace = true
csv.workspace = true
crc32fast.workspace = true

[features]
# Production builds.
#
# The `tauri` crate's build script computes `dev = !custom_protocol`, and `dev = true`
# makes the binary load `devUrl` instead of the bundled frontend — on launch that is
# "localhost refused to connect", not a blank window. Verified: without this feature
# `cargo build --release` reports `cargo:dev=true`; with it, `cargo:dev=false`.
#
# Declaring it here is what lets both the Tauri CLI and an explicit
# `--features hexadof-desktop/custom-protocol` turn production mode on.
custom-protocol = ["tauri/custom-protocol"]
