[package]
name = "hexadof-desktop"
description = "HexaDOF desktop application shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "hexadof-desktop"

[lib]
name = "hexadof_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex-core.workspace = true
hex-dynamics.workspace = true
hex-model.workspace = true
hex-telemetry.workspace = true
hex-flight-data.workspace = true
hex-analysis.workspace = true
hex-project.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nalgebra.workspace = true
csv.workspace = true
crc32fast.workspace = true
